
<!DOCTYPE html>
<html lang="ru">
<!-- Я тег html. Я главный элемент HTML-документа.
     Внутри меня находится вся структура страницы. -->

<head>
    <!-- Я тег head. Я храню служебную информацию
         о странице, необходимую браузеру. -->

    <meta charset="UTF-8">

    <title>Лабораторная работа №3</title>
    <!-- Я тег title. Я задаю название страницы,
         которое видно на вкладке браузера. -->
</head>

<body>
    <!-- Я тег body. Я содержу всё, что пользователь
         видит на веб-странице. -->

    <h1>Лабораторная работа №3</h1>
    <!-- Я тег h1. Я создаю главный заголовок
         и обозначаю основную тему страницы. -->

    <h2>Вариант 14</h2>

    <p>
        В данной лабораторной работе рассматриваются
        основные HTML-теги и их назначение.
    </p>

</body>
</html>
